<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="grid layout, flex-box, to do list">
    <meta name="keywords" content="to_do_list">
    <title>To do when</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css">
    <link rel="stylesheet" type="text/css" href="docs/css/styles.css">
</head>

<body>
    <!-- Start header-->
    <header class="masthead">

        <div class="board-menu">
            <a href="#"><img src="docs/img/logo_light_wt.png" alt="logo"></a>
            <div class="board-search">
                <input type="search" value="" onblur="" aria-label="board search"><i class="fas fa-search search-icon"
                    aria-hidden="true"></i>
            </div>
        </div>

        <h1>do and forget forever</h1>

        <div class="user-settings">
            <!--<input type="text" id="listInput" placeholder="New list name">-->
            <button class="user-settings-btn" id="addListBtn" aria-label="Create"><i class="fas fa-plus"
                    aria-hidden="true"></i></button>
            <button class="user-settings-btn" aria-label="Information" disabled><i class="fas fa-info-circle"
                    aria-hidden="true"></i>
            </button>
            <button class="user-settings-btn" aria-label="Notifications" disabled><i class="fas fa-bell"
                    aria-hidden="true"></i>
            </button>
            <button class="user-settings-btn" aria-label="User settings" disabled><i class="fas fa-user-circle"
                    aria-hidden="true"></i>
            </button>
        </div>

    </header>
    <!-- End header-->

    <!-- Start board info -->
    <section class="board-info">

        <div class="board-controls">
            <button class="board-btn-task" aria-label="All"><i class="fas fa-globe"></i>
            </button>
            <button class="board-btn-task" aria-label="HOME"><i class="fas fa-home"></i>
            </button>
            <button class="board-btn-task" aria-label="WORK"><i class="fas fa-briefcase"></i>
            </button>
            <button class="board-btn-task" aria-label="MEETING"><i class="far fa-handshake"></i>
            </button>
            <button class="board-btn-task" aria-label="OTHER"><i class="fas fa-cookie"></i>
            </button>
        </div>

    </section>
    <!-- End board info -->

    <!-- Start Lists container -->
    <section class="lists-container">

        <div class="list" data-id="home">
            <h3>Today I must do </h3>
            <ul class="list-items">
            </ul>
            <div class="add-task-form">
                <input type="text" class="taskInput" id="addTaskInput" placeholder="Enter task title">
                <button class="add-task-btn">Add</button>
            </div>
            <div class="sort-task-form">
                <button class="sort-tasks-btn">Last added</button>
            </div><div class="filter-task-form">
                <button class="filter-tasks-btn">Finished</button>
            </div>
            <div class="remove-task-form">
                <button class="remove-task-btn">Remove</button>
            </div>
        </div>

        <div class="weather-container">
            <p>So, have you decided if this weather is good for your tasks?</p>
        </div>
        <div class="weather-container">
            <h3>Weather in Gdynia</h3>
            <div class="weather-info">
                <p>Loading weather...</p>
                <p>So, have you decided if this weather is good for your tasks?</p>
            </div>
        </div>

    </section>
    <!-- End Lists container -->

    <script src="docs/js/script.js"></script>
</body>

</html>
